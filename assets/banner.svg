<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rian do Nascimento Ribeiro — Engenharia de Software na UDF, desenvolvedor backend em formação">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2563EB" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue" cx="82%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowNavy" cx="8%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fade { animation: fade 1.2s ease-out both; }
      .fade2 { animation: fade 1.2s ease-out .35s both; }
      @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="#0D1117"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowBlue)"/>
    <rect width="1200" height="320" fill="url(#glowNavy)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#1C2A44"/>

  <!-- lado esquerdo -->
  <g class="fade">
    <text x="64" y="92" class="mono" font-size="17" fill="#38BDF8">~/rian-ribeiro-dev<tspan fill="#8B949E"> $ whoami</tspan></text>
    <text x="64" y="158" class="sans" font-size="50" font-weight="700" fill="#E6EDF3">Rian do Nascimento Ribeiro</text>
    <rect x="64" y="180" width="120" height="3" rx="1.5" fill="url(#line)"/>
  </g>
  <g class="fade2">
    <text x="64" y="224" class="sans" font-size="22" fill="#60A5FA">Engenharia de Software · UDF</text>
    <text x="64" y="256" class="sans" font-size="20" fill="#C9D1D9">Desenvolvedor backend em formação<tspan fill="#38BDF8" class="cursor"> ▍</tspan></text>
  </g>

  <!-- bloco decorativo à direita -->
  <g class="fade2" transform="translate(842 78)">
    <rect width="300" height="168" rx="12" fill="#0D1117" fill-opacity="0.75" stroke="#1C2A44"/>
    <circle cx="20" cy="20" r="5" fill="#38BDF8"/>
    <circle cx="38" cy="20" r="5" fill="#1C2A44"/>
    <circle cx="56" cy="20" r="5" fill="#1C2A44"/>
    <text x="20" y="62" class="mono" font-size="14" fill="#8B949E">rian <tspan fill="#C9D1D9">=</tspan> {</text>
    <text x="38" y="86" class="mono" font-size="14" fill="#60A5FA">curso<tspan fill="#C9D1D9">:</tspan> <tspan fill="#93C5FD">"Eng. Software"</tspan>,</text>
    <text x="38" y="108" class="mono" font-size="14" fill="#60A5FA">stack<tspan fill="#C9D1D9">:</tspan> [<tspan fill="#93C5FD">"C"</tspan>, <tspan fill="#93C5FD">"Python"</tspan>],</text>
    <text x="38" y="130" class="mono" font-size="14" fill="#60A5FA">busca<tspan fill="#C9D1D9">:</tspan> <tspan fill="#93C5FD">"estágio em TI"</tspan></text>
    <text x="20" y="152" class="mono" font-size="14" fill="#C9D1D9">}</text>
  </g>
</svg>
