<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-label="Números no GitHub">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#1E3A8A" stop-opacity=".45"/><stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/></radialGradient>
    <style>.s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.m{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
    .in{animation:in .8s ease-out both}@keyframes in{from{opacity:0}to{opacity:1}}</style>
  </defs>
  <rect x=".5" y=".5" width="459" height="199" rx="14" fill="#0D1117" stroke="#1C2A44"/>
  <rect x=".5" y=".5" width="459" height="199" rx="14" fill="url(#glow)"/>
  <rect x="24" y="23" width="4" height="22" rx="2" fill="url(#g)"/>
  <text x="38" y="40" class="s" font-size="17" font-weight="700" fill="#E6EDF3">Números no GitHub</text>
  <circle cx="30" cy="73" r="3" fill="#38BDF8"/>
  <text x="44" y="78" class="s" font-size="14" fill="#C9D1D9">Repositórios públicos</text>
  <text x="290" y="78" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#60A5FA">5</text>
  <circle cx="30" cy="97" r="3" fill="#38BDF8"/>
  <text x="44" y="102" class="s" font-size="14" fill="#C9D1D9">Commits no último ano</text>
  <text x="290" y="102" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#60A5FA">27</text>
  <circle cx="30" cy="121" r="3" fill="#38BDF8"/>
  <text x="44" y="126" class="s" font-size="14" fill="#C9D1D9">Pull requests</text>
  <text x="290" y="126" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#60A5FA">0</text>
  <circle cx="30" cy="145" r="3" fill="#38BDF8"/>
  <text x="44" y="150" class="s" font-size="14" fill="#C9D1D9">Issues</text>
  <text x="290" y="150" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#60A5FA">0</text>
  <circle cx="30" cy="169" r="3" fill="#38BDF8"/>
  <text x="44" y="174" class="s" font-size="14" fill="#C9D1D9">Estrelas recebidas</text>
  <text x="290" y="174" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#60A5FA">0</text>
  <circle cx="380" cy="110" r="46" fill="none" stroke="#1C2A44" stroke-width="6"/>
  <circle cx="380" cy="110" r="46" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" transform="rotate(-90 380 110)" class="in"/>
  <text x="380" y="114" text-anchor="middle" class="m" font-size="22" font-weight="700" fill="#E6EDF3">33</text>
  <text x="380" y="134" text-anchor="middle" class="s" font-size="11" fill="#8B949E">contribuições</text>
  <text x="380" y="180" text-anchor="middle" class="s" font-size="11" fill="#8B949E">no último ano</text>
</svg>
