name: Gerar snake de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar os SVGs da snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F472B6&color_dots=#EBEDF0,#C7DDFB,#79B8FF,#388BFD,#1F6FEB
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F472B6&color_dots=#161B22,#0C2D6B,#1158C7,#388BFD,#79C0FF&color_background=#0D1117

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
