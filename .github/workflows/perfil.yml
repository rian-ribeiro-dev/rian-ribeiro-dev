name: Atualizar perfil

# Gera a snake de contribuições e os cards de estatísticas
# (stats, linguagens, atividade e troféus) e publica tudo na branch "output".
on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: atualizar-perfil
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar os SVGs da snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F472B6&color_dots=#EBEDF0,#C7DDFB,#79B8FF,#388BFD,#1F6FEB
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F472B6&color_dots=#161B22,#0C2D6B,#1158C7,#388BFD,#79C0FF&color_background=#0D1117

      - name: Gerar cards de estatísticas
        run: python3 .github/scripts/gerar_cards.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
